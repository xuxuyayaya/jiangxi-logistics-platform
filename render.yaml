services:
  - type: web
    name: jiangxi-logistics-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ENTERPRISE_PASSWORD
        sync: false
      - key: AMAP_WEB_KEY
        sync: false
      - key: AMAP_SECURITY_CODE
        sync: false
